name: 每日自动更新看板

on:
  # ⛔ 2026-09-18 停用云端定时任务。
  # 原因（已实证）：云端 runner 无本机 cache/ 与 Wind 数据，抓取不完整；更关键的是它
  # checkout 的是仓库里的 template.html，用「旧模板」重建 index.html 后 commit 覆盖
  # 本机 18:30 推出的完整版本，导致页面出现「数据补充中」空白卡；又因它不推送
  # version.txt，前端版本探针读到旧版本号 → 误判「已是最新」→ 问题被锁死。
  # 实测：本机 09-17 18:32 推 0d9fea0fb521，云端 09-17 23:14 推 b4554a6e58ac 覆盖之。
  # 每日更新已由本机 Windows 计划任务 EarlETF_Dashboard_Update（周一~五 18:30，
  # 跑 etfchart\auto_update.py）负责。需要临时云端更新时用下面的「手动触发」。
  # schedule:
  #   - cron: '30 10 * * *'
  workflow_dispatch:   # 手动触发（保留）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests numpy pandas akshare

      # 缓存作为加速层（cache miss 时靠 git checkout 的缓存文件兜底）
      - name: 恢复缓存
        uses: actions/cache@v4
        id: cache
        with:
          path: cache
          key: etf-cache-v2

      - name: 保证 cache 目录存在
        run: mkdir -p cache

      - name: 抓取数据
        id: fetch
        run: |
          # 检查缓存是否充足（git checkout 自带完整缓存，actions/cache 作为加速）
          CSI_COUNT=$(find cache -maxdepth 1 -name "csi*.csv" 2>/dev/null | wc -l)
          echo "cache 中 csi*.csv 数量: $CSI_COUNT"

          if [ "$CSI_COUNT" -ge 15 ]; then
            echo "=== 日常增量模式 ==="
            python fetch_data.py --quick
          elif [ "$CSI_COUNT" -ge 3 ]; then
            echo "=== 准冷启动（缓存部分可用，全量但有断点续跑） ==="
            python fetch_data.py
          else
            echo "=== 完整冷启动（缓存不足，全量回填） ==="
            python fetch_data.py
          fi
        timeout-minutes: 15

      - name: 构建页面
        run: python build.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json data.js version.txt cache/
          if git diff --staged --quiet; then
            echo "内容未变化，跳过提交。"
          else
            git commit -m "chore: 自动更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi