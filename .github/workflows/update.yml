name: 每日自动更新看板

on:
  schedule:
    # 北京时间 18:30 = UTC 10:30
    - cron: '30 10 * * *'
  workflow_dispatch:   # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests numpy pandas akshare

      # 缓存作为加速层（cache miss 时靠 git checkout 的缓存文件兜底）
      - name: 恢复缓存
        uses: actions/cache@v4
        id: cache
        with:
          path: cache
          key: etf-cache-v2

      - name: 保证 cache 目录存在
        run: mkdir -p cache

      - name: 抓取数据
        id: fetch
        run: |
          # 检查缓存是否充足（git checkout 自带完整缓存，actions/cache 作为加速）
          CSI_COUNT=$(find cache -maxdepth 1 -name "csi*.csv" 2>/dev/null | wc -l)
          echo "cache 中 csi*.csv 数量: $CSI_COUNT"

          if [ "$CSI_COUNT" -ge 15 ]; then
            echo "=== 日常增量模式 ==="
            python fetch_data.py --quick
          elif [ "$CSI_COUNT" -ge 3 ]; then
            echo "=== 准冷启动（缓存部分可用，全量但有断点续跑） ==="
            python fetch_data.py
          else
            echo "=== 完整冷启动（缓存不足，全量回填） ==="
            python fetch_data.py
          fi
        timeout-minutes: 15

      - name: 构建页面
        run: python build.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json data.js cache/
          if git diff --staged --quiet; then
            echo "内容未变化，跳过提交。"
          else
            git commit -m "chore: 自动更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi